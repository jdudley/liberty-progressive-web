<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 680" role="img" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d3439"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="938" height="678" fill="#fafaf9" stroke="#c9d1d6" stroke-width="1.5"/>
  <line x1="178" y1="340" x2="762" y2="340" stroke="#2d3439" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="470" y1="78" x2="470" y2="602" stroke="#2d3439" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="470" y="64" text-anchor="middle" font-family="'IBM Plex Serif', Georgia, serif" font-size="21" font-weight="700" fill="#2d3439">Liberty</text>
  <text x="470" y="634" text-anchor="middle" font-family="'IBM Plex Serif', Georgia, serif" font-size="21" font-weight="700" fill="#2d3439">Statist</text>
  <text x="166" y="346" text-anchor="end" font-family="'IBM Plex Serif', Georgia, serif" font-size="21" font-weight="700" fill="#2d3439">Revolutionary</text>
  <text x="774" y="346" text-anchor="start" font-family="'IBM Plex Serif', Georgia, serif" font-size="21" font-weight="700" fill="#2d3439">Reformer</text>
  <text x="304" y="179" text-anchor="middle" font-size="16">
      <tspan x="304" font-weight="700" fill="#2d3439">Open System Radicals:</tspan><tspan x="304" dy="26" font-weight="400" fill="#576b79">Anarcho-capitalists,</tspan><tspan x="304" dy="19" font-weight="400" fill="#576b79">radical decentralizers</tspan><tspan x="304" dy="19" font-weight="400" fill="#576b79">(e.g., crypto zealots)</tspan>
    </text>
<text x="636" y="179" text-anchor="middle" font-size="16">
      <tspan x="636" font-weight="700" fill="#2d3439">Epistemic Reformers:</tspan><tspan x="636" dy="26" font-weight="400" fill="#576b79">Pragmatic,</tspan><tspan x="636" dy="19" font-weight="400" fill="#576b79">pro-freedom,</tspan><tspan x="636" dy="19" font-weight="400" fill="#576b79">pro-abundance.</tspan><tspan x="636" dy="19" font-weight="400" fill="#576b79">(e.g., Jared Polis)</tspan>
    </text>
<text x="304" y="451" text-anchor="middle" font-size="16">
      <tspan x="304" font-weight="700" fill="#2d3439">Moral Centralizers:</tspan><tspan x="304" dy="26" font-weight="400" fill="#576b79">Moral crusaders</tspan><tspan x="304" dy="19" font-weight="400" fill="#576b79">seeking systematic</tspan><tspan x="304" dy="19" font-weight="400" fill="#576b79">overhaul.</tspan><tspan x="304" dy="19" font-weight="400" fill="#576b79">(e.g., Zohran Mamdani)</tspan>
    </text>
<text x="636" y="451" text-anchor="middle" font-size="16">
      <tspan x="636" font-weight="700" fill="#2d3439">Technocratic Pragmatists:</tspan><tspan x="636" dy="26" font-weight="400" fill="#576b79">Skilled managers of</tspan><tspan x="636" dy="19" font-weight="400" fill="#576b79">top-down institutions</tspan><tspan x="636" dy="19" font-weight="400" fill="#576b79">(e.g., Gavin Newsom)</tspan>
    </text>
</svg>
